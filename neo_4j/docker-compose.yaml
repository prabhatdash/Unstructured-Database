version: "3.9"

services:
  neo4j:
    image: neo4j:5.19
    container_name: neo4j_db
    restart: unless-stopped

    ports:
      - "7474:7474"
      - "7687:7687"

    # IMPORTANT: set a container memory limit (so Neo4j can validate against it)
    deploy:
      resources:
        limits:
          memory: 6G

    environment:
      NEO4J_AUTH: neo4j/StrongPassword123

      # Neo4j 5 plugin env var name
      NEO4J_PLUGINS: '["apoc"]'

      # Memory (must fit inside the container limit)
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 2G

      # APOC file import/export (optional)
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_apoc_import_file_use__neo4j__config: "true"

      # Allow APOC procedures
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*,gds.*"

    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins

    ulimits:
      nofile:
        soft: 40000
        hard: 40000

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins: